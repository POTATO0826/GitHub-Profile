<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Vince Loo — A Tech Guy who is caffeinated.</title>
  <desc id="d">A page from Vince Loo's field notes. Data Science and Software Development student in Malaysia, night owl. Hackathons in 2026: nine entered, five placed.</desc>

  <style>
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .mono  { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans  { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }

    /* One curve, one entrance: the page is written left to right, then stamped. */
    .in { opacity: 0; animation: rise 620ms cubic-bezier(0.16, 1, 0.30, 1) forwards; }
    .b1 { animation-delay:  80ms; }
    .b2 { animation-delay: 180ms; }
    .b3 { animation-delay: 280ms; }
    .b4 { animation-delay: 380ms; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .slot  { opacity: 0; animation: fade 400ms ease-out 520ms forwards; }
    @keyframes fade { to { opacity: 1; } }

    .stamp { opacity: 0; transform-box: fill-box; transform-origin: center; animation: stamp 420ms cubic-bezier(0.16, 1, 0.30, 1) forwards; }
    .s1 { animation-delay:  900ms; }
    .s2 { animation-delay: 1080ms; }
    .s3 { animation-delay: 1260ms; }
    .s4 { animation-delay: 1440ms; }
    .s5 { animation-delay: 1620ms; }
    @keyframes stamp { from { opacity: 0; transform: scale(1.7) rotate(-14deg); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .in, .slot, .stamp { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <defs>
    <clipPath id="page"><rect width="1200" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#page)">
    <rect width="1200" height="300" fill="#000"/>

    <!-- coffee ring: the mug was here -->
    <g fill="none" stroke="#c9a070" transform="rotate(-18 668 132)">
      <circle cx="668" cy="132" r="56" stroke-width="5"   stroke-opacity="0.16" stroke-dasharray="150 9 90 5 120 14"/>
      <circle cx="668" cy="132" r="51" stroke-width="1.5" stroke-opacity="0.22" stroke-dasharray="60 20 130 12 80 30"/>
      <circle cx="668" cy="132" r="60" stroke-width="1"   stroke-opacity="0.12" stroke-dasharray="40 26 100 18"/>
    </g>

    <!-- notebook furniture: punch holes, margin rule, ruled lines -->
    <g fill="#000" stroke="#fff" stroke-opacity="0.2">
      <circle cx="36" cy="62"  r="7"/>
      <circle cx="36" cy="150" r="7"/>
      <circle cx="36" cy="238" r="7"/>
    </g>
    <line x1="72" y1="0" x2="72" y2="300" stroke="#fff" stroke-opacity="0.12"/>
    <line x1="72" y1="232" x2="1200" y2="232" stroke="#fff" stroke-opacity="0.08"/>

    <!-- left: who -->
    <text x="106" y="54" class="mono in b1" font-size="15" fill="#a1a1aa" letter-spacing="1.6">@POTATO0826  ·  MALAYSIA</text>

    <text x="102" y="160" class="serif in b2" font-size="104" fill="#fafafa" letter-spacing="-1.5">Vince <tspan font-style="italic">Loo</tspan></text>

    <text x="106" y="204" class="sans in b3" font-size="24" fill="#d4d4d8">A Tech Guy who is caffeinated.</text>

    <text x="106" y="268" class="mono in b4" font-size="14.5" fill="#a1a1aa" letter-spacing="2">DATA SCIENCE  ·  SOFTWARE DEV  ·  NIGHT OWL</text>

    <!-- right: the 2026 hackathon tally. Gold marks an award and nothing else. -->
    <text x="1132" y="54" class="mono in b1" font-size="15" fill="#a1a1aa" letter-spacing="1.6" text-anchor="end">HACKATHONS  ·  2026</text>

    <g class="slot" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 4">
      <circle cx="812" cy="118" r="15"/>
      <circle cx="852" cy="118" r="15"/>
      <circle cx="892" cy="118" r="15"/>
      <circle cx="932" cy="118" r="15"/>
      <circle cx="972" cy="118" r="15"/>
      <circle cx="1012" cy="118" r="15"/>
      <circle cx="1052" cy="118" r="15"/>
      <circle cx="1092" cy="118" r="15"/>
      <circle cx="1132" cy="118" r="15"/>
    </g>

    <g stroke="#e0b357" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g class="stamp s1"><circle cx="812" cy="118" r="15" fill="#1c1608"/><path d="M805 118.5 l5 5 l9 -10.5" fill="none"/></g>
      <g class="stamp s2"><circle cx="852" cy="118" r="15" fill="#1c1608"/><path d="M845 118.5 l5 5 l9 -10.5" fill="none"/></g>
      <g class="stamp s3"><circle cx="892" cy="118" r="15" fill="#1c1608"/><path d="M885 118.5 l5 5 l9 -10.5" fill="none"/></g>
      <g class="stamp s4"><circle cx="932" cy="118" r="15" fill="#1c1608"/><path d="M925 118.5 l5 5 l9 -10.5" fill="none"/></g>
      <g class="stamp s5"><circle cx="972" cy="118" r="15" fill="#1c1608"/><path d="M965 118.5 l5 5 l9 -10.5" fill="none"/></g>
    </g>

    <g class="in b4">
      <text x="796" y="210" class="serif" font-size="64" fill="#e0b357">5</text>
      <text x="836" y="204" class="mono" font-size="15" fill="#e0b357" letter-spacing="1.6">PLACED</text>
      <text x="986" y="210" class="serif" font-size="64" fill="#fafafa">9</text>
      <text x="1026" y="204" class="mono" font-size="15" fill="#a1a1aa" letter-spacing="1.6">ENTERED</text>
    </g>

    <text x="1132" y="268" class="mono in b4" font-size="14.5" fill="#a1a1aa" letter-spacing="2" text-anchor="end">VINCEPROFILE.SPACE</text>

    <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#fff" stroke-opacity="0.16"/>
  </g>
</svg>
